<!DOCTYPE html>
<html>
<head>
    <title>Parking Spots - {{ lot.name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h3 class="mb-4 text-primary">Parking Spots for {{ lot.name }}</h3>
    
    <div class="row">
        {% for spot in spots %}
        <div class="col-md-3 mb-3">
            <div class="card text-center {{ 'bg-success' if spot.status == 'A' else 'bg-danger' }} text-white">
                <div class="card-body">
                    <h5>Spot {{ loop.index }}</h5>
                    <p>{{ 'Available' if spot.status == 'A' else 'Occupied' }}</p>
                    
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="text-center mt-4">
        <a href="{{ url_for('user_dashboard') }}" class="btn btn-secondary">← Back to Dashboard</a>
    </div>
</div>
</body>
</html>
